services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: secretspots
      POSTGRES_USER: secretspots
      POSTGRES_PASSWORD: secretspots_local_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretspots -d secretspots"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: secretspots
      MINIO_ROOT_PASSWORD: secretspots_local_dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted analytics (step 1 of adding user-behavior tracking) — its own database
  # (docker/initdb/02-create-umami-db.sql), separate from the app's own data. The web UI
  # (dashboards/custom events) lives at http://localhost:3001.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://secretspots:secretspots_local_dev@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: umami_local_dev_secret_change_in_production
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
